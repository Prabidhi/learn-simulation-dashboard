# Publishes the Learning Lab to GitLab Pages whenever something lands on main,
# or when a topic repo (see topics.json) asks for a rebuild.

stages:
  - test
  - secret-detection
  - deploy

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: test

secret_detection:
  stage: secret-detection

# A stale hash stops a page's scripts running, so fail before it can deploy.
# Also builds the full site, which pulls in the topic repos listed in topics.json
# and fails if any of their pages is stale or missing.
csp-check:
  stage: test
  image: python:3.13-alpine
  script:
    - apk add --no-cache git >/dev/null
    - python3 scripts/update_csp.py --check
    - python3 scripts/build_site.py

# Builds the whole site in public/: this repo's dashboards/ plus each topic repo.
# Topic repos (e.g. learn-oracle) trigger this pipeline on main when they change.
pages:
  stage: deploy
  image: python:3.13-alpine
  script:
    - apk add --no-cache git >/dev/null
    - python3 scripts/build_site.py
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Template overrides via CI/CD variables:
# SAST: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Variable precedence: https://docs.gitlab.com/ci/variables/#cicd-variable-precedence