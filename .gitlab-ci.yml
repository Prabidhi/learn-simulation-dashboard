# Publishes everything in dashboards/ to GitLab Pages whenever something
# lands on the default branch (i.e. an MR is merged to main).
#
# - Your own dashboards/index.html is used if present.
# - Otherwise a searchable home page is generated automatically.

  pages:
    image: alpine:latest
    script:
      - cp -r dashboards public
    artifacts:
      paths: [public]
    rules:
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
