# Publishes everything in dashboards/ to GitLab Pages whenever something
# lands on the default branch (i.e. an MR is merged to main).
#
# - Your own dashboards/index.html is used if present.
# - Otherwise a searchable home page is generated automatically.

stages:
  - test
  - secret-detection
  - deploy

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: test

secret_detection:
  stage: secret-detection

pages:
  stage: deploy
  image: alpine:latest
  script:
    - cp -r dashboards public
    - |
      if [ ! -f public/index.html ]; then
        echo '<!doctype html><html><head><meta charset="utf-8"><title>Dashboards</title></head><body><h1>Dashboards</h1><input id="q" placeholder="Search..." autofocus><ul id="list">' > public/index.html
        find public -name '*.html' ! -path public/index.html | sort | while read -r f; do
          rel="${f#public/}"
          echo "<li><a href=\"$rel\">$rel</a></li>" >> public/index.html
        done
        echo '</ul><script>q.oninput=()=>{const v=q.value.toLowerCase();for(const li of list.children)li.hidden=!li.textContent.toLowerCase().includes(v)}</script></body></html>' >> public/index.html
      fi
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Template overrides via CI/CD variables:
# SAST: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Variable precedence: https://docs.gitlab.com/ci/variables/#cicd-variable-precedence