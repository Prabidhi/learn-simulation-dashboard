<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Lab</title>
<meta name="description" content="Interactive, offline learning dashboards.">
<style>
:root{
  --bg:#f5f3ef;--bg2:#ece8e1;--panel:#fffdf9;--fg:#1c1a17;--muted:#6b665d;--line:#ddd7cc;
  --grid:rgba(28,26,23,.05);--shadow:0 1px 2px rgba(28,26,23,.06),0 8px 24px -12px rgba(28,26,23,.18);
  --git:#e5532d;--quantum:#7a4fe0;--oracle:#c74634;--default:#2f7d6d;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Charter,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root{--on-c:#ffffff;--sky:none}
:root[data-theme="dark"]{
  --bg:#0f1115;--bg2:#161922;--panel:#161922;--fg:#ece9e3;--muted:#9a978f;--line:#272b36;
  --grid:rgba(236,233,227,.045);--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -14px rgba(0,0,0,.7);
  --git:#ff7a52;--quantum:#a98bff;--oracle:#ff7b6b;--default:#4fc1a6;--on-c:#14161c;
}
:root[data-theme="twilight"]{
  --bg:#231f38;--bg2:#2d2747;--panel:#2b2544;--fg:#f6ebe6;--muted:#b9aac4;--line:#433a63;
  --grid:rgba(246,235,230,.05);--shadow:0 1px 2px rgba(10,6,25,.35),0 14px 34px -14px rgba(10,6,25,.75);
  --git:#ff9b6e;--quantum:#c7aaff;--oracle:#ff8f86;--default:#ffc47d;--on-c:#211b33;
  --sky:linear-gradient(180deg,#4a3463 0%,#3a2d58 22%,#2a2444 55%,#1d1a30 100%);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#0f1115;--bg2:#161922;--panel:#161922;--fg:#ece9e3;--muted:#9a978f;--line:#272b36;
  --grid:rgba(236,233,227,.045);--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -14px rgba(0,0,0,.7);
  --git:#ff7a52;--quantum:#a98bff;--oracle:#ff7b6b;--default:#4fc1a6;--on-c:#14161c;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;min-height:100vh;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;background-position:-1px -1px;background-attachment:fixed}
:root[data-theme="twilight"] body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),var(--sky);background-size:32px 32px,32px 32px,100% 100%}
:root[data-theme="twilight"] h1 em{background-image:linear-gradient(100deg,#ffb37a,#ff8fa3 45%,#c7aaff)}

a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand svg{width:22px;height:22px}
.themes{display:flex;gap:2px;padding:3px;border:1px solid var(--line);background:var(--panel);border-radius:999px;box-shadow:var(--shadow)}
.themes button{font:inherit;font-size:.8rem;display:flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.themes button:hover{color:var(--fg)}
.themes button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.themes svg{width:16px;height:16px;flex:none}
@media (max-width:480px){.themes button span{display:none}.themes button{padding:7px 9px}}
/* hero */
.hero{padding:48px 0 34px;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:end}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--default);box-shadow:0 0 0 4px color-mix(in srgb,var(--default) 22%,transparent);animation:pulse 2.4s ease-in-out infinite}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.6rem,6vw,4.4rem);line-height:1.02;letter-spacing:-.02em;margin:0}
h1 em{font-style:italic;background:linear-gradient(100deg,var(--git),var(--quantum));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
.hero p{color:var(--muted);font-size:1.05rem;max-width:520px;margin:18px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;box-shadow:var(--shadow)}
.stat{padding:16px 18px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--serif);font-weight:500;font-size:2rem;line-height:1}
.stat span{font-size:.78rem;color:var(--muted)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:10px 0 22px;border-top:1px solid var(--line)}
.search{position:relative;flex:1;max-width:420px;min-width:220px}
.search input{width:100%;font:inherit;padding:11px 44px 11px 40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);outline:none;box-shadow:var(--shadow)}
.search input:focus{border-color:var(--fg)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted);background:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:.84rem;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:7px 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px}
.chip i{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{font-family:var(--mono);font-size:.72rem;opacity:.65}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;padding-bottom:30px}
.card{--c:var(--default);position:relative;display:flex;flex-direction:column;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;opacity:0;transform:translateY(10px);animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 18px 40px -18px color-mix(in srgb,var(--c) 70%,transparent);outline:none}
.art{position:relative;height:170px;background:color-mix(in srgb,var(--c) 9%,var(--panel));border-bottom:1px solid var(--line);overflow:hidden}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.art .badge{position:absolute;top:14px;left:14px;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;background:var(--panel);border:1px solid var(--line);padding:3px 9px;border-radius:999px;display:flex;align-items:center;gap:6px}
.art .badge i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.art .new{position:absolute;top:14px;right:14px;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;background:var(--c);color:var(--on-c);padding:3px 9px;border-radius:999px}
.body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{font-family:var(--serif);font-weight:500;font-size:1.45rem;line-height:1.15;margin:0;letter-spacing:-.01em}
.card p{margin:0;color:var(--muted);font-size:.92rem}
.card ul{margin:2px 0 0;padding:0;list-style:none;display:grid;gap:5px}
.card li{font-size:.86rem;display:flex;gap:8px;align-items:baseline}
.card li::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--c);transform:translateY(-2px)}
.foot{margin-top:auto;padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px dashed var(--line)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-family:var(--mono);font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.go{font-size:.85rem;font-weight:600;color:var(--c);display:flex;align-items:center;gap:6px;white-space:nowrap}
.go svg{width:16px;height:16px;transition:transform .25s}
.card:hover .go svg{transform:translateX(4px)}
.empty{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:18px}

footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--muted);font-size:.8rem;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
footer code{font-family:var(--mono);font-size:.76rem;background:var(--bg2);padding:1px 6px;border-radius:5px}

@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--default) 0%,transparent)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-40}}
.orbit{transform-origin:center;transform-box:fill-box;animation:spin 14s linear infinite}
.flow{stroke-dasharray:6 6;animation:dash 2.4s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:26px;padding-top:24px}}
@media (max-width:480px){.wrap{padding:0 16px}.grid{grid-template-columns:1fr}.stat{padding:12px}.stat b{font-size:1.6rem}.search{max-width:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/></svg>
      Learning Lab
    </div>
    <div class="themes" id="themes" role="group" aria-label="Colour theme"></div>
  </div>

  <section class="hero">
    <div>
      <div class="eyebrow"><i></i>Interactive · works offline</div>
      <h1>Learn by <em>poking</em><br>at things.</h1>
      <p>Hands-on dashboards with sliders, simulators and live diagrams. Every page runs right in your browser with no setup.</p>
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <div class="toolbar">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search dashboards…" aria-label="Search dashboards">
      <kbd>/</kbd>
    </label>
    <div class="chips" id="chips" role="group" aria-label="Filter by topic"></div>
  </div>

  <main class="grid" id="grid" aria-live="polite"></main>

  <footer>
    <span>Built for me and my team · hosted on GitLab Pages</span>
    <span>Add a dashboard: append it to <code>DASHBOARDS</code> in this file</span>
  </footer>
</div>

<script>
/* =========================================================
   ADD NEW DASHBOARDS HERE — one entry each.
   topic must match a key in TOPICS; art: 'git' | 'quantum' | 'generic'
   ========================================================= */
const DASHBOARDS = [
  {
    title: 'Git Cheat Sheet & Simulator',
    href: 'git/git-simulator.html',
    topic: 'git',
    art: 'git',
    added: '2026-10-24',
    desc: 'A safe sandbox repo with a live commit graph. Type real git commands and watch branches move.',
    points: ['Terminal with 25+ git commands', 'Nine self-checking challenges', 'Searchable cheat sheet with analogies'],
    tags: ['branching', 'merge', 'rebase', 'undo']
  },
  {
    title: 'Quantum vs Classical Chips',
    href: 'quantum/quantum-vs-classical.html',
    topic: 'quantum',
    art: 'quantum',
    added: '2026-10-24',
    desc: 'Why a bit is a shouting crowd and a qubit is a whisper, and why that forces freezers colder than space.',
    points: ['Measure and collapse a qubit', 'See current flow vs slosh', 'Drag temperature to 0.01 K'],
    tags: ['qubits', 'superconductors', 'hardware']
  },
];

const TOPICS = {
  git:     { label: 'Git',     color: 'var(--git)' },
  quantum: { label: 'Quantum', color: 'var(--quantum)' },
  oracle:  { label: 'Oracle',  color: 'var(--oracle)' },
};

/* ---------- card illustrations ---------- */
const ART = {
  git: c => `<svg viewBox="0 0 340 170" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke-width="3" stroke-linecap="round">
      <path d="M-10 92 H350" stroke="${c}" opacity=".9"/>
      <path class="flow" d="M90 92 C130 92 130 48 170 48 H250 C290 48 290 92 330 92" stroke="${c}" opacity=".55"/>
      <path d="M150 92 C185 92 185 128 220 128 H262" stroke="${c}" opacity=".3"/>
    </g>
    ${[[40,92],[90,92],[150,92],[210,92],[270,92],[330,92]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="9" fill="${c}"/>`).join('')}
    ${[[200,48],[250,48]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="8" fill="var(--panel)" stroke="${c}" stroke-width="3"/>`).join('')}
    <circle cx="262" cy="128" r="7" fill="var(--panel)" stroke="${c}" stroke-width="2.5" stroke-dasharray="3 3" opacity=".6"/>
    <circle cx="330" cy="92" r="15" fill="none" stroke="${c}" stroke-width="2" opacity=".5"/>
  </svg>`,
  quantum: c => `<svg viewBox="0 0 340 170" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g transform="translate(170 86) scale(.82)">
      <circle r="58" fill="none" stroke="${c}" stroke-width="1.5" opacity=".35"/>
      <ellipse rx="58" ry="17" fill="none" stroke="${c}" stroke-width="1.2" stroke-dasharray="4 5" opacity=".45"/>
      <path d="M0 -70 V70" stroke="${c}" stroke-width="1" opacity=".25"/>
      <line x1="0" y1="0" x2="38" y2="-44" stroke="${c}" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="38" cy="-44" r="14" fill="${c}" opacity=".18"/>
      <circle cx="38" cy="-44" r="6.5" fill="${c}"/>
      <g class="orbit"><circle cx="0" cy="0" r="80" fill="none"/><circle cx="80" cy="0" r="4" fill="${c}" opacity=".7"/><circle cx="-56" cy="57" r="3" fill="${c}" opacity=".5"/></g>
      <text x="0" y="-76" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="${c}">|0⟩</text>
      <text x="0" y="86" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="${c}">|1⟩</text>
    </g>
    ${Array.from({length:14},(_,i)=>`<rect x="${14+i*6}" y="${150-((i*37)%40)}" width="3" height="${(i*37)%40}" rx="1.5" fill="${c}" opacity=".18"/>`).join('')}
    ${Array.from({length:14},(_,i)=>`<rect x="${242+i*6}" y="${150-((i*53)%40)}" width="3" height="${(i*53)%40}" rx="1.5" fill="${c}" opacity=".18"/>`).join('')}
  </svg>`,
  generic: (c,t) => `<svg viewBox="0 0 340 170" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    ${Array.from({length:6},(_,i)=>`<circle cx="170" cy="85" r="${20+i*22}" fill="none" stroke="${c}" opacity="${.5-i*.07}"/>`).join('')}
    <text x="170" y="98" text-anchor="middle" font-family="Georgia,serif" font-size="40" fill="${c}">${(t||'?')[0]}</text>
  </svg>`
};

/* ---------- rendering ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let topic = 'all';
const isNew = d => d.added && (Date.now() - new Date(d.added)) / 864e5 <= 14;
const topicOf = d => TOPICS[d.topic] || { label: d.topic || 'Other', color: 'var(--default)' };

function renderStats(){
  const topics = new Set(DASHBOARDS.map(d => d.topic));
  const newest = DASHBOARDS.map(d => d.added).filter(Boolean).sort().pop();
  const when = newest ? new Date(newest + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '—';
  $('#stats').innerHTML =
    `<div class="stat"><b>${DASHBOARDS.length}</b><span>dashboards</span></div>` +
    `<div class="stat"><b>${topics.size}</b><span>topics</span></div>` +
    `<div class="stat"><b>${when}</b><span>last added</span></div>`;
}
function renderChips(){
  const counts = {}; DASHBOARDS.forEach(d => counts[d.topic] = (counts[d.topic] || 0) + 1);
  const list = [['all', 'All', 'var(--fg)', DASHBOARDS.length], ...Object.keys(counts).map(k => [k, topicOf({topic:k}).label, topicOf({topic:k}).color, counts[k]])];
  $('#chips').innerHTML = list.map(([k, l, c, n]) =>
    `<button class="chip" data-k="${esc(k)}" aria-pressed="${k === topic}">${k === 'all' ? '' : `<i style="background:${c}"></i>`}${esc(l)} <span class="n">${n}</span></button>`).join('');
  $('#chips').querySelectorAll('.chip').forEach(b => b.onclick = () => { topic = b.dataset.k; renderChips(); renderGrid(); });
}
function renderGrid(){
  const q = $('#q').value.trim().toLowerCase();
  const items = DASHBOARDS.filter(d => (topic === 'all' || d.topic === topic) &&
    (!q || [d.title, d.desc, ...(d.points||[]), ...(d.tags||[]), topicOf(d).label].join(' ').toLowerCase().includes(q)));
  $('#grid').innerHTML = items.length ? items.map((d, i) => {
    const t = topicOf(d), art = (ART[d.art] || ART.generic)(t.color, d.title);
    return `<a class="card" href="${esc(d.href)}" style="--c:${t.color};animation-delay:${i * 70}ms">
      <div class="art">${art}<span class="badge"><i></i>${esc(t.label)}</span>${isNew(d) ? '<span class="new">New</span>' : ''}</div>
      <div class="body">
        <h3>${esc(d.title)}</h3>
        <p>${esc(d.desc)}</p>
        ${d.points ? `<ul>${d.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
        <div class="foot">
          <div class="tags">${(d.tags||[]).slice(0,4).map(g => `<span>${esc(g)}</span>`).join('')}</div>
          <span class="go">Open <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </div>
      </div>
    </a>`;
  }).join('') : `<div class="empty">Nothing matches “${esc(q)}”. Try another word or pick “All”.</div>`;
}

/* ---------- theme: day / twilight / dark ---------- */
const ICONS = {
  day: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  twilight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 18a5 5 0 0 0-10 0"/><path d="M12 2v5M4.2 10.2l1.4 1.4M1 18h2M21 18h2M18.4 11.6l1.4-1.4M23 22H1M16 5l-4 4-4-4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
};
const THEMES = [['day','Day'],['twilight','Twilight'],['dark','Dark']];
function currentTheme(){ const t = document.documentElement.dataset.theme; return t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'day'); }
function setTheme(t){
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('lab-theme', t); } catch (e) {}
  paintThemes();
}
function paintThemes(){
  const cur = currentTheme();
  $('#themes').innerHTML = THEMES.map(([k,l]) => `<button data-k="${k}" aria-pressed="${k===cur}" title="${l} mode">${ICONS[k]}<span>${l}</span></button>`).join('');
  $('#themes').querySelectorAll('button').forEach(b => b.onclick = () => setTheme(b.dataset.k));
}
try { let saved = localStorage.getItem('lab-theme'); if (saved === 'light') saved = 'day'; if (saved && ICONS[saved]) document.documentElement.dataset.theme = saved; } catch (e) {}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!document.documentElement.dataset.theme) paintThemes(); });

/* ---------- search ---------- */
$('#q').addEventListener('input', renderGrid);
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape' && document.activeElement === $('#q')) { $('#q').value = ''; renderGrid(); $('#q').blur(); }
});

paintThemes(); renderStats(); renderChips(); renderGrid();
</script>
</body>
</html>
